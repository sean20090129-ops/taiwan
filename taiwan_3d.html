```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>台灣 3D 地形探索</title>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #e8dfcf;
            font-family: "Noto Sans TC", sans-serif;
        }

        #title {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 10;

            padding: 15px 22px;

            background: rgba(255, 250, 240, 0.9);
            border: 2px solid #594a3a;
            border-radius: 12px;

            box-shadow: 4px 4px 0 rgba(70, 55, 40, 0.25);
        }

        #title h1 {
            margin: 0 0 5px;
            font-size: 25px;
        }

        #title p {
            margin: 0;
            font-size: 14px;
        }

        #hint {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            padding: 10px 18px;

            background: rgba(255, 250, 240, 0.9);
            border-radius: 20px;

            font-size: 14px;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="title">
        <h1>⛰️ 台灣 3D 地形探索</h1>
        <p>探索台灣的山脈與地形</p>
    </div>

    <div id="hint">
        🖱️ 拖曳旋轉　｜　滾輪縮放
    </div>

    <script>

        // ==========================================
        // 1. 建立場景
        // ==========================================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0xe8dfcf);


        // ==========================================
        // 2. 建立攝影機
        // ==========================================

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 8, 12);


        // ==========================================
        // 3. 建立畫面
        // ==========================================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        document.body.appendChild(renderer.domElement);


        // ==========================================
        // 4. 光源
        // ==========================================

        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            1.5
        );

        scene.add(ambientLight);


        const directionalLight = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        directionalLight.position.set(
            5,
            10,
            5
        );

        scene.add(directionalLight);


        // ==========================================
        // 5. 台灣地形
        // ==========================================

        const shape = new THREE.Shape();

        // 簡化版台灣輪廓
        shape.moveTo(0, 5);

        shape.lineTo(1.0, 4.3);
        shape.lineTo(1.5, 3.0);
        shape.lineTo(1.3, 1.5);
        shape.lineTo(0.8, 0);
        shape.lineTo(0.3, -1.7);
        shape.lineTo(-0.2, -3.3);
        shape.lineTo(-0.7, -4.5);
        shape.lineTo(-1.2, -5.0);

        shape.lineTo(-1.6, -4.0);
        shape.lineTo(-1.5, -2.5);
        shape.lineTo(-1.1, -1.0);
        shape.lineTo(-1.0, 0.5);
        shape.lineTo(-1.2, 2.0);
        shape.lineTo(-0.8, 3.5);
        shape.lineTo(-0.3, 4.5);

        shape.lineTo(0, 5);


        // ==========================================
        // 6. 建立 3D 模型
        // ==========================================

        const geometry = new THREE.ExtrudeGeometry(
            shape,
            {
                depth: 0.5,
                bevelEnabled: true,
                bevelSegments: 3,
                bevelSize: 0.12,
                bevelThickness: 0.12
            }
        );

        geometry.center();


        const material = new THREE.MeshStandardMaterial({
            color: 0x8ca878,
            roughness: 0.8
        });


        const taiwan = new THREE.Mesh(
            geometry,
            material
        );

        scene.add(taiwan);


        // ==========================================
        // 7. OrbitControls
        // ==========================================

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;

        controls.dampingFactor = 0.05;

        controls.minDistance = 6;

        controls.maxDistance = 25;


        // ==========================================
        // 8. 地面
        // ==========================================

        const groundGeometry =
            new THREE.CircleGeometry(12, 64);

        const groundMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xd8ccb7
            });

        const ground =
            new THREE.Mesh(
                groundGeometry,
                groundMaterial
            );

        ground.rotation.x = -Math.PI / 2;

        ground.position.y = -0.5;

        scene.add(ground);


        // ==========================================
        // 9. 視窗大小改變
        // ==========================================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // ==========================================
        // 10. 動畫
        // ==========================================

        function animate() {

            requestAnimationFrame(animate);

            controls.update();

            renderer.render(
                scene,
                camera
            );
        }

        animate();

    </script>

</body>
</html>
