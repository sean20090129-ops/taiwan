<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣智慧文化旅遊推薦</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f4f7f2;
      color: #2c3a2f;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }
    .sub {
      color: #657064;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(50,70,50,.08);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 12px 0 6px;
    }
    select, input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd8cb;
      border-radius: 10px;
      font-size: 14px;
      background: #fbfcf9;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #b7c7b0;
      background: #f3f7f0;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .chip.active {
      background: #547b58;
      color: #fff;
      border-color: #547b58;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #547b58;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #result {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 14.5px;
    }
    .hint {
      font-size: 12px;
      color: #7a877a;
      margin-top: 8px;
    }
    .api-box {
      background: #fff8e8;
      border: 1px solid #f0e0b0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇹🇼 台灣智慧文化旅遊推薦</h1>
    <div class="sub">服務觀光客與旅行社 · 依興趣推薦景點（OpenAI）</div>

    <div class="api-box">
      <label>OpenAI API Key（只在本機使用，不會上傳到其他伺服器）</label>
      <input id="apiKey" type="password" placeholder="sk-...">
      <div class="hint">建議先用 gpt-4o-mini，性價比高</div>
    </div>

    <div class="card">
      <label>興趣主題（可多選）</label>
      <div class="chips" id="interestChips">
        <div class="chip" data-value="原住民文化">原住民文化</div>
        <div class="chip" data-value="客家文化">客家文化</div>
        <div class="chip" data-value="歷史文化">歷史文化</div>
        <div class="chip" data-value="自然景觀">自然景觀</div>
        <div class="chip" data-value="美食體驗">美食體驗</div>
        <div class="chip" data-value="慢活 hidden">慢活</div>
        <div class="chip" data-value="手作體驗">手作體驗</div>
      </div>

      <label>天數</label>
      <select id="days">
        <option value="1">1 天</option>
        <option value="2" selected>2 天</option>
        <option value="3">3 天</option>
      </select>

      <label>同行對象</label>
      <select id="companions">
        <option value="一般旅客">一般旅客</option>
        <option value="情侶">情侶</option>
        <option value="家庭（含小孩）">家庭（含小孩）</option>
        <option value="長者">長者</option>
        <option value="旅行社團體">旅行社團體</option>
      </select>

      <label>偏好區域（可選）</label>
      <select id="region">
        <option value="不限">不限</option>
        <option value="北部">北部</option>
        <option value="中部">中部</option>
        <option value="南部">南部</option>
        <option value="東部">東部</option>
      </select>

      <label>補充需求（可選）</label>
      <textarea id="extra" rows="2" placeholder="例如：不要太操、想要有文化體驗、方便停車…"></textarea>

      <button id="btn">產生推薦</button>
    </div>

    <div class="card">
      <label>推薦結果</label>
      <div id="result">尚未產生推薦</div>
    </div>
  </div>

  <script>
    // ========== 精簡景點資料（之後可換成完整 JSON）==========
    const spots = [
      { name: "太魯閣國家公園", city: "花蓮縣", themes: ["自然景觀", "原住民文化"], tags: ["峽谷", "太魯閣族"], duration: 4, suitable: ["一般旅客", "健行者"], desc: "大理石峽谷與太魯閣族文化" },
      { name: "日月潭", city: "南投縣", themes: ["自然景觀", "原住民文化"], tags: ["湖泊", "邵族"], duration: 4, suitable: ["一般旅客", "家庭"], desc: "邵族文化與湖景遊船" },
      { name: "阿里山", city: "嘉義縣", themes: ["自然景觀", "原住民文化"], tags: ["森林", "鄒族"], duration: 5, suitable: ["一般旅客"], desc: "森林鐵道與鄒族文化" },
      { name: "九份老街", city: "新北市", themes: ["歷史文化"], tags: ["老街", "山城"], duration: 3, suitable: ["一般旅客", "情侶"], desc: "山城老街與懷舊氛圍" },
      { name: "鹿港老街", city: "彰化縣", themes: ["歷史文化", "美食體驗"], tags: ["古蹟", "閩南"], duration: 3, suitable: ["一般旅客", "家庭"], desc: "傳統街巷與在地小吃" },
      { name: "北埔老街", city: "新竹縣", themes: ["客家文化", "美食體驗"], tags: ["擂茶", "古厝"], duration: 3, suitable: ["一般旅客"], desc: "客家擂茶與老街文化" },
      { name: "南庄", city: "苗栗縣", themes: ["客家文化", "慢活"], tags: ["桂花巷", "慢活"], duration: 3, suitable: ["一般旅客", "情侶"], desc: "客庄慢活與桂花巷" },
      { name: "美濃", city: "高雄市", themes: ["客家文化", "手作體驗"], tags: ["紙傘", "擂茶"], duration: 3, suitable: ["一般旅客", "家庭"], desc: "客家紙傘與農村文化" },
      { name: "臺灣原住民族文化園區", city: "屏東縣", themes: ["原住民文化"], tags: ["園區", "表演"], duration: 4, suitable: ["家庭", "旅行社團體"], desc: "各族文化展示與表演" },
      { name: "禮納里部落", city: "屏東縣", themes: ["原住民文化"], tags: ["部落體驗"], duration: 3, suitable: ["一般旅客"], desc: "排灣族部落文化體驗" },
      { name: "烏來", city: "新北市", themes: ["原住民文化", "自然景觀"], tags: ["泰雅", "溫泉"], duration: 4, suitable: ["一般旅客", "情侶"], desc: "泰雅文化與溫泉" },
      { name: "蘭嶼", city: "台東縣", themes: ["原住民文化", "自然景觀"], tags: ["達悟", "離島"], duration: 8, suitable: ["一般旅客"], desc: "達悟族文化與海洋" },
      { name: "台東池上", city: "台東縣", themes: ["慢活", "自然景觀"], tags: ["稻田", "攝影"], duration: 3, suitable: ["一般旅客", "情侶"], desc: "伯朗大道與稻田景觀" },
      { name: "安平古堡", city: "台南市", themes: ["歷史文化"], tags: ["古蹟"], duration: 2, suitable: ["一般旅客", "家庭"], desc: "台灣重要歷史地標" },
      { name: "赤崁樓", city: "台南市", themes: ["歷史文化"], tags: ["古蹟"], duration: 1.5, suitable: ["一般旅客"], desc: "台南經典歷史建築" },
      { name: "國立故宮博物院", city: "台北市", themes: ["歷史文化"], tags: ["博物館"], duration: 3, suitable: ["一般旅客", "旅行社團體"], desc: "中華文物典藏" },
      { name: "野柳地質公園", city: "新北市", themes: ["自然景觀"], tags: ["奇岩"], duration: 2, suitable: ["一般旅客", "家庭"], desc: "女王頭等地質景觀" },
      { name: "墾丁", city: "屏東縣", themes: ["自然景觀"], tags: ["海灘", "度假"], duration: 6, suitable: ["一般旅客", "情侶"], desc: "南台灣海灘與度假" },
      { name: "清境", city: "南投縣", themes: ["自然景觀"], tags: ["高地", "農場"], duration: 4, suitable: ["家庭"], desc: "高地景觀與農場" },
      { name: "鶯歌", city: "新北市", themes: ["手作體驗", "歷史文化"], tags: ["陶瓷"], duration: 3, suitable: ["家庭", "一般旅客"], desc: "陶瓷老街與手作體驗" }
    ];

    // 興趣 chip 選擇
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('active'));
    });

    function getSelectedInterests() {
      return [...document.querySelectorAll('.chip.active')].map(c => c.dataset.value);
    }

    document.getElementById('btn').addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        alert('請先填入 OpenAI API Key');
        return;
      }

      const interests = getSelectedInterests();
      if (interests.length === 0) {
        alert('請至少選擇一個興趣主題');
        return;
      }

      const days = document.getElementById('days').value;
      const companions = document.getElementById('companions').value;
      const region = document.getElementById('region').value;
      const extra = document.getElementById('extra').value.trim();

      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      btn.disabled = true;
      btn.textContent = '推薦產生中…';
      result.textContent = '正在呼叫 AI，請稍候…';

      const prompt = `
你是台灣智慧文化旅遊推薦助手，同時服務一般觀光客與旅行社規劃人員。

使用者條件：
- 興趣：${interests.join('、')}
- 天數：${days} 天
- 同行對象：${companions}
- 偏好區域：${region}
- 補充需求：${extra || '無'}

可用景點資料（JSON）：
${JSON.stringify(spots, null, 2)}

請用繁體中文輸出，格式如下：

【推薦景點】
1. 景點名稱（縣市）
   - 推薦理由：
   - 建議停留：
   - 適合對象：

【建議遊玩順序】
（依天數與動線安排）

【旅行社包裝建議】
- 一句話賣點：
- 可強調的體驗：

【注意事項】
- 交通或體力提醒
`;

      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              { role: 'system', content: '你是專業的台灣文化旅遊規劃助手。' },
              { role: 'user', content: prompt }
            ],
            temperature: 0.7
          })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }

        const data = await res.json();
        result.textContent = data.choices[0].message.content;
      } catch (err) {
        result.textContent = '發生錯誤：\n' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '產生推薦';
      }
    });
  </script>
</body>
</html>
