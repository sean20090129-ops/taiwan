<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>台灣 3D 地形 - Cesium 版</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    .panel {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(250, 248, 239, 0.92); backdrop-filter: blur(10px);
      padding: 18px 20px; border-radius: 18px; width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15); font-family: "Noto Sans TC", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 20px; color: #26372d; }
    .sub { font-size: 13px; color: #657064; line-height: 1.5; margin-bottom: 12px; }
    button {
      width: 100%; padding: 9px; margin-top: 6px; border: none; border-radius: 12px;
      background: #547b58; color: white; font-size: 14px; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div class="panel">
    <h1>⛰️ 台灣 3D 地形</h1>
    <div class="sub">Cesium 版本 · 真實地形 · 可旋轉縮放</div>
    <button onclick="flyToTaiwan()">定位到台灣</button>
    <button onclick="toggleTerrain()">切換地形高度</button>
  </div>

  <script>
    // 請換成你自己的 Cesium Ion Access Token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Imlud2RyR25ZUnNmMjNDeEIiLCJqdGkiOiIzOWExMmFmYi1jZGZjLTQ3NTQtODYzNy01MDQyN2Y0YWJkZjIiLCJpZCI6NDg3MTU0LCJzdWIiOiJzZWFuMjAwOTAxMjktb3BzIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IjEiLCJpYXQiOjE3ODkwNTEwNDl9.qTlH1FhnoiFFheSfDkQ2xABUfqspFdHjIrgH5lrOgPI';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),   // 真實全球地形
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false
    });

    // 初始定位到台灣
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(121.0, 23.7, 1200000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0
      },
      duration: 0
    });

    function flyToTaiwan() {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(121.0, 23.7, 800000),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch: Cesium.Math.toRadians(-40),
          roll: 0
        },
        duration: 1.5
      });
    }

    let terrainEnabled = true;
    function toggleTerrain() {
      if (terrainEnabled) {
        viewer.scene.terrainProvider = new Cesium.EllipsoidTerrainProvider();
      } else {
        viewer.scene.setTerrain(Cesium.Terrain.fromWorldTerrain());
      }
      terrainEnabled = !terrainEnabled;
    }

    // 之後可以在這裡加景點標記
    // 範例：玉山
    viewer.entities.add({
      name: '玉山',
      position: Cesium.Cartesian3.fromDegrees(120.9595, 23.4700, 3952),
      point: {
        pixelSize: 12,
        color: Cesium.Color.ORANGE,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      },
      label: {
        text: '玉山',
        font: '14px sans-serif',
        pixelOffset: new Cesium.Cartesian2(0, -20),
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE
      }
    });
  </script>
</body>
</html>
