<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣智慧文化旅遊推薦（模擬版）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f4f7f2;
      color: #2c3a2f;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }
    h1 { font-size: 24px; margin: 0 0 6px; }
    .sub { color: #657064; font-size: 14px; margin-bottom: 22px; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(50,70,50,.08);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 12px 0 6px;
    }
    select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd8cb;
      border-radius: 10px;
      font-size: 14px;
      background: #fbfcf9;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #b7c7b0;
      background: #f3f7f0;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .chip.active {
      background: #547b58;
      color: #fff;
      border-color: #547b58;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #547b58;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    #result {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 14.5px;
    }
    .badge {
      display: inline-block;
      background: #e8f0e6;
      color: #3d5a40;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇹🇼 台灣智慧文化旅遊推薦</h1>
    <div class="sub">模擬版 · 不需 API · 可直接 Demo</div>

    <div class="card">
      <label>興趣主題（可多選）</label>
      <div class="chips">
        <div class="chip" data-value="原住民文化">原住民文化</div>
        <div class="chip" data-value="客家文化">客家文化</div>
        <div class="chip" data-value="歷史文化">歷史文化</div>
        <div class="chip" data-value="自然景觀">自然景觀</div>
        <div class="chip" data-value="美食體驗">美食體驗</div>
        <div class="chip" data-value="慢活">慢活</div>
        <div class="chip" data-value="手作體驗">手作體驗</div>
      </div>

      <label>天數</label>
      <select id="days">
        <option value="1">1 天</option>
        <option value="2" selected>2 天</option>
        <option value="3">3 天</option>
      </select>

      <label>同行對象</label>
      <select id="companions">
        <option value="一般旅客">一般旅客</option>
        <option value="情侶">情侶</option>
        <option value="家庭（含小孩）">家庭（含小孩）</option>
        <option value="長者">長者</option>
        <option value="旅行社團體">旅行社團體</option>
      </select>

      <label>偏好區域</label>
      <select id="region">
        <option value="不限">不限</option>
        <option value="北部">北部</option>
        <option value="中部">中部</option>
        <option value="南部">南部</option>
        <option value="東部">東部</option>
      </select>

      <label>補充需求（可選）</label>
      <textarea id="extra" rows="2" placeholder="例如：不要太操、想要有文化體驗…"></textarea>

      <button id="btn">產生推薦</button>
    </div>

    <div class="card">
      <div class="badge">模擬 AI 推薦結果</div>
      <div id="result">尚未產生推薦</div>
    </div>
  </div>

  <script>
    const spots = [
      { name: "太魯閣國家公園", city: "花蓮縣", region: "東部", themes: ["自然景觀", "原住民文化"], duration: "4小時", reason: "壯麗峽谷與太魯閣族文化，適合深度體驗" },
      { name: "日月潭", city: "南投縣", region: "中部", themes: ["自然景觀", "原住民文化"], duration: "4小時", reason: "邵族文化與湖景，適合家庭與一般旅客" },
      { name: "阿里山", city: "嘉義縣", region: "南部", themes: ["自然景觀", "原住民文化"], duration: "5小時", reason: "森林鐵道與鄒族文化" },
      { name: "九份老街", city: "新北市", region: "北部", themes: ["歷史文化"], duration: "3小時", reason: "山城老街與懷舊氛圍，拍照與漫遊皆宜" },
      { name: "鹿港老街", city: "彰化縣", region: "中部", themes: ["歷史文化", "美食體驗"], duration: "3小時", reason: "傳統街巷與在地小吃豐富" },
      { name: "北埔老街", city: "新竹縣", region: "北部", themes: ["客家文化", "美食體驗"], duration: "3小時", reason: "客家擂茶與古厝文化" },
      { name: "南庄", city: "苗栗縣", region: "北部", themes: ["客家文化", "慢活"], duration: "3小時", reason: "客庄慢活與桂花巷氛圍" },
      { name: "美濃", city: "高雄市", region: "南部", themes: ["客家文化", "手作體驗"], duration: "3小時", reason: "客家紙傘與農村文化體驗" },
      { name: "臺灣原住民族文化園區", city: "屏東縣", region: "南部", themes: ["原住民文化"], duration: "4小時", reason: "各族文化展示與表演，適合團體" },
      { name: "禮納里部落", city: "屏東縣", region: "南部", themes: ["原住民文化"], duration: "3小時", reason: "排灣族部落文化體驗" },
      { name: "烏來", city: "新北市", region: "北部", themes: ["原住民文化", "自然景觀"], duration: "4小時", reason: "泰雅文化與溫泉" },
      { name: "台東池上", city: "台東縣", region: "東部", themes: ["慢活", "自然景觀"], duration: "3小時", reason: "伯朗大道與稻田景觀，適合慢遊" },
      { name: "安平古堡", city: "台南市", region: "南部", themes: ["歷史文化"], duration: "2小時", reason: "台灣重要歷史地標" },
      { name: "國立故宮博物院", city: "台北市", region: "北部", themes: ["歷史文化"], duration: "3小時", reason: "中華文物典藏，適合深度文化遊" },
      { name: "野柳地質公園", city: "新北市", region: "北部", themes: ["自然景觀"], duration: "2小時", reason: "女王頭等地質奇景" },
      { name: "墾丁", city: "屏東縣", region: "南部", themes: ["自然景觀"], duration: "6小時", reason: "南台灣海灘與度假氛圍" },
      { name: "鶯歌", city: "新北市", region: "北部", themes: ["手作體驗", "歷史文化"], duration: "3小時", reason: "陶瓷老街與手作體驗" }
    ];

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('active'));
    });

    function getSelectedInterests() {
      return [...document.querySelectorAll('.chip.active')].map(c => c.dataset.value);
    }

    function mockRecommend() {
      const interests = getSelectedInterests();
      const days = document.getElementById('days').value;
      const companions = document.getElementById('companions').value;
      const region = document.getElementById('region').value;
      const extra = document.getElementById('extra').value.trim();

      if (interests.length === 0) {
        alert('請至少選擇一個興趣主題');
        return;
      }

      // 篩選景點
      let filtered = spots.filter(s => {
        const themeMatch = s.themes.some(t => interests.includes(t));
        const regionMatch = region === '不限' || s.region === region;
        return themeMatch && regionMatch;
      });

      if (filtered.length === 0) {
        filtered = spots.filter(s => s.themes.some(t => interests.includes(t)));
      }

      // 依天數取景點數
      const count = days === '1' ? 3 : days === '2' ? 5 : 7;
      filtered = filtered.slice(0, count);

      let text = `【推薦景點】（依您的條件模擬產生）\n\n`;
      filtered.forEach((s, i) => {
        text += `${i + 1}. ${s.name}（${s.city}）\n`;
        text += `   - 推薦理由：${s.reason}\n`;
        text += `   - 建議停留：${s.duration}\n`;
        text += `   - 適合對象：${companions}\n\n`;
      });

      text += `【建議遊玩順序】\n`;
      if (days === '1') {
        text += `上午 → ${filtered[0]?.name || ''}；下午 → ${filtered[1]?.name || ''}；傍晚 → ${filtered[2]?.name || ''}\n\n`;
      } else if (days === '2') {
        text += `Day1：${filtered.slice(0, 3).map(s => s.name).join(' → ')}\n`;
        text += `Day2：${filtered.slice(3).map(s => s.name).join(' → ')}\n\n`;
      } else {
        text += `Day1：${filtered.slice(0, 3).map(s => s.name).join(' → ')}\n`;
        text += `Day2：${filtered.slice(3, 5).map(s => s.name).join(' → ')}\n`;
        text += `Day3：${filtered.slice(5).map(s => s.name).join(' → ')}\n\n`;
      }

      text += `【旅行社包裝建議】\n`;
      text += `- 一句話賣點：深度體驗台灣「${interests.join('、')}」的精華行程\n`;
      text += `- 可強調的體驗：文化導覽、在地美食、適合${companions}的節奏\n\n`;

      text += `【注意事項】\n`;
      text += `- 建議預留交通時間，山區景點請注意體力\n`;
      if (extra) text += `- 已參考您的補充需求：${extra}\n`;
      text += `- 此為模擬結果，之後可接真實 AI 提升個人化程度`;

      document.getElementById('result').textContent = text;
    }

    document.getElementById('btn').addEventListener('click', mockRecommend);
  </script>
</body>
</html>
